<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-label="Jarvis architecture: the owner talks to a Claude Code session on an Ubuntu VM through Remote Control. The session follows runbooks and calls guarded scripts that reach the servers over SSH, Proxmox for snapshots, Home Assistant and GitLab CI, and reports to Discord. systemd timers run the morning health check, reminders and pre-patch preparation.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ffb000"/></marker>
    <style>
      .box { fill: #1e1913; stroke: #3a3127; }
      .h { fill: #eadfcb; font-weight: 600; font-size: 13px; }
      .s { fill: #a0907a; font-size: 11px; }
      .m { font-family: Consolas, 'DejaVu Sans Mono', monospace; }
      .ln { stroke: #ffb000; stroke-width: 1.5; fill: none; }
      .dot { animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </defs>
  <rect width="960" height="420" rx="14" fill="#15110c"/>

  <!-- People side -->
  <rect class="box" x="24" y="70" width="180" height="84" rx="8"/>
  <text x="114" y="98" text-anchor="middle" class="h">You</text>
  <text x="114" y="118" text-anchor="middle" class="s">Claude app on phone or PC</text>
  <text x="114" y="134" text-anchor="middle" class="s">via Remote Control</text>

  <rect class="box" x="24" y="250" width="180" height="84" rx="8"/>
  <text x="114" y="278" text-anchor="middle" class="h">Discord</text>
  <text x="114" y="298" text-anchor="middle" class="s">every outcome, failures too</text>
  <text x="114" y="314" text-anchor="middle" class="s m">bin/notify</text>

  <!-- The VM -->
  <rect x="250" y="44" width="420" height="340" rx="12" fill="#0c0a07" stroke="#ffb000"/>
  <text x="270" y="70" font-size="14" font-weight="700" fill="#ffb000">Jarvis VM</text>
  <text x="352" y="70" class="s">small Ubuntu VM, always on</text>
  <circle class="dot" cx="650" cy="65" r="5" fill="#9ccb7f"/>

  <rect class="box" x="270" y="86" width="380" height="64" rx="8"/>
  <text x="290" y="110" class="h">Claude Code session in tmux</text>
  <text x="290" y="130" class="s"><tspan class="m">jarvis-session.service</tspan> keeps it running; after a planned</text>
  <text x="290" y="144" class="s">reboot it starts by checking everything came back</text>

  <rect class="box" x="270" y="164" width="185" height="96" rx="8"/>
  <text x="285" y="188" class="h">Runbooks</text>
  <text x="285" y="206" class="s m">skills/patch-servers</text>
  <text x="285" y="222" class="s m">skills/safe-reboot</text>
  <text x="285" y="238" class="s m">skills/fleet-status</text>

  <rect class="box" x="465" y="164" width="185" height="96" rx="8"/>
  <text x="480" y="188" class="h">Guarded tools</text>
  <text x="480" y="206" class="s m">jarvis-patch</text>
  <text x="480" y="222" class="s m">jarvis-snapshot</text>
  <text x="480" y="238" class="s m">jarvis-fleet-status …</text>

  <rect class="box" x="270" y="274" width="380" height="92" rx="8"/>
  <text x="290" y="298" class="h">systemd timers</text>
  <text x="290" y="318" class="s">morning fleet health check · dated reminders</text>
  <text x="290" y="334" class="s">pre-patch snapshot and state before the nightly run</text>
  <text x="290" y="350" class="s">no AI needed for the routine checks</text>

  <!-- Targets -->
  <g>
    <rect class="box" x="716" y="44" width="220" height="62" rx="8"/>
    <text x="732" y="68" class="h">Ubuntu servers</text>
    <text x="732" y="88" class="s">SSH: patch, phased + kept back</text>

    <rect class="box" x="716" y="122" width="220" height="62" rx="8"/>
    <text x="732" y="146" class="h">Proxmox</text>
    <text x="732" y="166" class="s">API: snapshot before every patch</text>

    <rect class="box" x="716" y="200" width="220" height="62" rx="8"/>
    <text x="732" y="224" class="h">Home Assistant</text>
    <text x="732" y="244" class="s">MCP; locks, alarm, garage ask first</text>

    <rect class="box" x="716" y="278" width="220" height="62" rx="8"/>
    <text x="732" y="302" class="h">GitLab CI</text>
    <text x="732" y="322" class="s">waits, retries one-off failures</text>
  </g>

  <!-- Arrows -->
  <path class="ln" d="M205 112 H268" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M268 320 C230 320, 230 292, 207 292" marker-end="url(#a)"/>
  <path class="ln" d="M651 200 C690 200, 690 75, 713 75" marker-end="url(#a)"/>
  <path class="ln" d="M651 208 C690 208, 690 153, 713 153" marker-end="url(#a)"/>
  <path class="ln" d="M651 216 C690 216, 690 231, 713 231" marker-end="url(#a)"/>
  <path class="ln" d="M651 224 C690 224, 690 309, 713 309" marker-end="url(#a)"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#ffb000">How Jarvis fits together</text>
  <text x="24" y="400" class="s">Never reboots the hypervisor, Home Assistant, the router or the NAS without a yes. Secrets live outside the repo.</text>
</svg>
